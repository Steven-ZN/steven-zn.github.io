# 站点基础
title: "Steven Zhang"
description: "Ph.D. student in Computer Science & Engineering at the University of South Florida. Medical imaging, CT reconstruction and calibration, label-efficient segmentation."
url: "https://steven-zn.github.io"
baseurl: ""

# 使用 Minimal Mistakes 主题（GitHub Pages 兼容）
remote_theme: "mmistakes/minimal-mistakes"

# 主题皮肤与外观
skin: "air"   # 必须与 assets/css/main.scss 里 @import 的 skin 保持一致

# 作者信息
locale: en-US
author:
  name: "Nuojunxi (Steven) Zhang"
  avatar: "/images/avatar.jpg"
  bio: "Ph.D. student in Computer Science & Engineering at USF's Bellini College. Medical imaging: CT reconstruction &amp; calibration, label-efficient segmentation.<br><br>nuojunxi@usf.edu"
  location: "Tampa, Florida, USA"
  links:
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:nuojunxi@usf.edu"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/Steven-ZN"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/steven-zn"
    - label: "Download CV"
      icon: "fas fa-download" 
      url: "/assets/documents/Nuojunxi_Zhang_CV.pdf"
      target: "_blank"

# 导航
collections:
  pages:
    output: true
    permalink: /:categories/:title/

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache

# Font Awesome
fontawesome:
  version: "6.0.0"  

# SEO
seo:
  type: "Person"
  name: "Steven Zhang"

# 分页（博客）
paginate: 6
paginate_path: "/blog/page:num/"

# 代码高亮
highlighter: rouge
markdown: kramdown
kramdown:
  input: GFM

# 默认 Front Matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true
      read_time: true
      toc: true
      toc_sticky: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Assets
sass:
  sass_dir: _sass
  style: compressed
 
# 站点图标
favicon: /images/favicon.svg
# Force rebuild 2026-08-22
